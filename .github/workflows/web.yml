name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2
  IMAGE: ghcr.io/${{ github.repository_owner }}/blobb-web

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Godot and web templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSLo godot.zip $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          curl -fsSLo tpz.tpz   $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip && mv Godot_v*_linux.x86_64 /usr/local/bin/godot
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dir && unzip -q tpz.tpz && mv templates/web_nothreads_release.zip $dir/

      - name: Export
        run: |
          mkdir -p build/web
          godot --headless --path . --import || true
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.pck

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
